<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos | FinControl</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Menú de la aplicación">
      <h2>FinControl</h2>
      <nav aria-label="Opciones">
        <ul>
          <li><a href="dashboard.html" >Inicio</a></li>
          <li><a href="ingresos.html" >Ingresos</a></li>
          <li><a href="gastos.html" aria-current="page">Gastos</a></li>
          <li><a href="reportes.html" >Reportes</a></li>
        </ul>
      </nav>
      <a class="salir" href="login.html">Cerrar sesión</a>
    </aside>

    <main class="contenido">
      <header>
        <h1>Gastos</h1>
        <p>Controla en qué se va tu dinero</p>
      </header>

      <section class="panel" aria-label="Nuevo gasto">
        <h2>Registrar gasto</h2>
        <form class="formulario" action="#">
          <div class="campo"><label for="g-desc">Descripción</label><input type="text" id="g-desc" placeholder="Ej: Mercado"></div>
          <div class="campo"><label for="g-monto">Monto</label><input type="number" id="g-monto" placeholder="0"></div>
          <div class="campo"><label for="g-cat">Categoría</label>
            <select id="g-cat"><option>Vivienda</option><option>Alimentación</option><option>Transporte</option><option>Ocio</option></select>
          </div>
          <button type="button" class="boton">Guardar gasto</button>
        </form>
      </section>

      <section class="panel" aria-label="Lista de gastos">
        <h2>Gastos del mes</h2>
        <table>
          <thead><tr><th>Fecha</th><th>Categoría</th><th>Monto</th></tr></thead>
          <tbody>
            <tr><td>07 oct</td><td>Vivienda</td><td class="neg">$ 900.000</td></tr>
            <tr><td>09 oct</td><td>Alimentación</td><td class="neg">$ 320.000</td></tr>
            <tr><td>11 oct</td><td>Transporte</td><td class="neg">$ 180.000</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
