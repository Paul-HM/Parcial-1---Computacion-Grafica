<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto 1a - Composición geométrica</title>
  <link rel="stylesheet" href="interfaz-a.css">
</head>
<body>
  <main class="lienzo">
    <header class="barra" role="banner" aria-label="Barra superior"></header>

    <section class="rejilla" aria-label="Figuras geométricas">

      <div class="celda rojo"></div>
      <div class="celda verde">
        <div class="rombo-exterior"><div class="rombo-interior"></div></div>
      </div>
      <div class="celda verde"></div>

      <div class="celda amarillo">
        <div class="marco"><div class="cuadro rojo"></div></div>
      </div>
      <div class="celda vacia"><div class="circulo vino"></div></div>
      <div class="celda vacia"><div class="circulo naranja"></div></div>

      <div class="celda barras">
        <div class="barra-n grande"></div>
        <div class="barra-n delgada"></div>
        <div class="barra-r"></div>
        <div class="barra-r"></div>
      </div>
      <div class="celda turquesa bajo">
        <div class="marco"><div class="cuadro turquesa-claro"></div></div>
      </div>
      <div class="celda verde">
        <div class="marco"><div class="cuadro verde-oscuro"></div></div>
      </div>
    </section>
  </main>
</body>
</html>
